<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="icon" type="image/png" href="../assets/favicon.png">
<link rel="apple-touch-icon" href="../assets/apple-touch-icon.png">
<script src="../assets/theme.js"></script>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>My courses — YourTechBuddy</title>
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../courses/courses.css">
<style>
  .wrap{max-width:900px;margin:0 auto;padding:40px 20px 60px;width:100%}
  h1{font-size:clamp(26px,3.5vw,34px);margin:0 0 6px;letter-spacing:-.02em}
  .sub{color:var(--muted);margin:0 0 28px}
  h2{font-size:15px;color:var(--muted);margin:32px 0 12px}
  .item{display:flex;gap:16px;align-items:center;background:var(--panel);border:1px solid var(--border);border-radius:12px;padding:14px;margin-bottom:12px;text-decoration:none}
  .item:hover{border-color:var(--text)}
  .item .th{width:160px;flex:none;aspect-ratio:16/9;border-radius:8px;overflow:hidden;background:var(--panel2);border:1px solid var(--border);display:grid;place-items:center;font:700 22px var(--mono)}
  .item .th img{width:100%;height:100%;object-fit:cover}
  .item .info{flex:1;min-width:0;display:flex;flex-direction:column;gap:8px}
  .item h3{margin:0;font-size:17px}
  .item .meta{display:flex;align-items:center;gap:12px;font-size:13px;color:var(--muted)}
  .item .meta .progress{flex:1;max-width:260px}
  .item .next{font-size:13px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .empty,.gate{background:var(--panel);border:1px dashed var(--border);border-radius:12px;padding:28px;text-align:center;color:var(--muted)}
  .gate{display:flex;flex-direction:column;align-items:center;gap:14px}
  .rows{display:flex;flex-direction:column;gap:8px}
  .row{display:flex;align-items:center;gap:12px;padding:12px 14px;background:var(--panel);border:1px solid var(--border);border-radius:12px;text-decoration:none;color:var(--text)}
  .row:hover{border-color:var(--accent)}
  .row b{font-weight:600}
  .row .m{margin-left:auto;font-size:13px;color:var(--muted);white-space:nowrap}
  .row .tg{font:600 11.5px var(--mono);padding:2px 8px;border-radius:99px;background:var(--panel2);color:var(--muted)}
  .row .bar{flex:0 0 120px;height:6px;border-radius:99px;background:var(--panel3);overflow:hidden}
  .row .bar i{display:block;height:100%;background:var(--ok)}
  .hint{font-size:14px;color:var(--muted)}
  .hint a{color:var(--accent)}
  @media (max-width:600px){ .row{flex-wrap:wrap} .row .m{margin-left:0;width:100%} .row .bar{flex:1 1 100%} }
  @media (max-width:600px){ .item{flex-direction:column;align-items:stretch} .item .th{width:100%} }
</style>
</head>
<body>
<header>
  <a class="brand" href="../"><div class="logo">YTB</div><b>yourtechbuddy</b></a>
  <nav>
    <a href="../playground/">playground</a>
    <a href="../courses/">courses</a>
    <a href="../practice/">practice</a>
    <a class="yt" href="https://www.youtube.com/@yourtechbuddy101" target="_blank" rel="noopener">youtube</a>
  </nav>
  <div id="auth"></div>
</header>

<main class="wrap">
  <h1 id="hello">My learning</h1>
  <p class="sub" id="sub">Your courses, mock interviews and company prep in one place.</p>
  <div id="content"></div>
</main>

<footer>Made by <a href="https://www.youtube.com/@yourtechbuddy101" target="_blank" rel="noopener">YourTechBuddy</a></footer>

<script src="../assets/config.js"></script>
<script src="../courses/courses.js"></script>
<script src="../assets/ytb.js"></script>
<script src="../assets/companies.js"></script>
<script>
  const esc = YTB.esc;
  const content = document.getElementById('content');

  (async () => {
    if (YTB.authOn && !YTB.user) {
      content.innerHTML = `<div class="gate"><b style="color:var(--text);font-size:17px">Sign in to see your courses</b>
        <span>Your progress is saved to your account and follows you across devices.</span><div id="gsi"></div></div>`;
      YTB.renderGoogleButton(document.getElementById('gsi'), { size: 'large' });
      return;
    }
    if (YTB.user) {
      document.getElementById('hello').textContent = `Hi ${YTB.user.name.split(' ')[0]} 👋`;
    } else {
      document.getElementById('sub').textContent = 'Progress is saved in this browser.';
    }

    content.innerHTML = '<p style="color:var(--muted)">Loading…</p>';
    const courses = await YTB.getCourses();
    const prog = await YTB.progress.loadAll(courses);

    const rows = courses.map((c) => {
      const lessons = (c.sections || []).flatMap((s) => s.lessons).filter((l) => l.youtube);
      const isPlaylist = !!c.playlist && !lessons.length;
      const done = prog[c.slug] || new Set();
      const total = isPlaylist ? (YTB.LS.get('ytb:count:' + c.slug, 0) || 0) : lessons.length;
      const count = isPlaylist ? done.size : lessons.filter((l) => done.has(l.youtube)).length;
      const pct = total ? Math.min(100, Math.round((count / total) * 100)) : 0;
      const next = lessons.find((l) => !done.has(l.youtube));
      return { c, lessons, count, total, pct, next };
    });

    const started = rows.filter((r) => r.count > 0).sort((a, b) => (a.pct === 100) - (b.pct === 100) || b.pct - a.pct);
    const rest = rows.filter((r) => r.count === 0);

    const card = (r) => {
      const first = r.lessons[0];
      const th = first ? `<img src="https://i.ytimg.com/vi/${encodeURIComponent(first.youtube)}/mqdefault.jpg" alt="" loading="lazy" onerror="this.remove()">` : esc(r.c.slug.toUpperCase());
      const href = `../courses/watch.html?c=${encodeURIComponent(r.c.slug)}` + (r.next ? `&v=${encodeURIComponent(r.next.youtube)}` : '');
      const status = r.pct === 100 ? '🎉 Completed' : r.count ? `${r.count} / ${r.total || '?'} lessons · ${r.pct}%` : `${r.total} lessons`;
      return `<a class="item" href="${href}">
        <div class="th">${th}</div>
        <div class="info">
          <h3>${esc(r.c.title)}</h3>
          <div class="meta"><div class="progress"><i style="width:${r.pct}%"></i></div><span>${status}</span></div>
          ${r.next && r.count ? `<div class="next">Up next: ${esc(r.next.title)}</div>` : ''}
        </div>
        <span class="btn ${r.count ? 'primary' : ''}">${r.pct === 100 ? 'Review' : r.count ? 'Continue' : 'Start'}</span>
      </a>`;
    };

    content.innerHTML =
      (started.length ? `<h2>In progress</h2>${started.map(card).join('')}`
                      : `<div class="empty">You haven't started a course yet. Pick one below.</div>`) +
      (rest.length ? `<h2>${started.length ? 'Explore more' : 'Courses'}</h2>${rest.map(card).join('')}` : '') +
      '<div id="mocks"></div><div id="cos"></div>';
    drawCompanies();
    drawMocks();
  })();

  // company checklists (ticks live in this browser)
  function drawCompanies() {
    const C = window.YTBCompanies; if (!C) return;
    const rows = C.list.map((co) => {
      const st = YTB.LS.get('ytb:co:' + co.key, {});
      const all = C.tracks.flatMap(([t]) => C.items(co, t).flatMap((g) => g.sections.flatMap((s) => s.items)));
      const done = all.filter((i) => st[i.id]).length, pct = Math.round(done / all.length * 100);
      return `<a class="row" href="../companies/?c=${co.key}"><b>${esc(co.name)}</b><div class="bar"><i style="width:${pct}%"></i></div><span class="m">${done} / ${all.length} ticked · ${pct}%</span></a>`;
    });
    document.getElementById('cos').innerHTML = `<h2>Prepare by company</h2><div class="rows">${rows.join('')}</div>`;
  }
  // mock interviews you've started (needs sign-in)
  async function drawMocks() {
    const el = document.getElementById('mocks');
    if (!YTB.user) { el.innerHTML = `<h2>Mock interviews</h2><p class="hint"><a href="../practice/">Try a mock interview</a>. Sign in and your attempts show up here.</p>`; return; }
    let list = [];
    try { list = (await YTB.api('/api/practice/attempts')).attempts || []; } catch { return; }
    const avg = (a) => { const v = Object.values(a.scores || {}).filter((x) => x != null); return v.length ? Math.round(v.reduce((s, x) => s + x, 0) / v.length * 10) / 10 : null; };
    el.innerHTML = `<h2>Mock interviews</h2>` + (list.length
      ? `<div class="rows">${list.slice(0, 6).map((a) => { const s = avg(a); return `<a class="row" href="../practice/session.html?id=${a.id}"><b>${esc(a.problem.title)}</b><span class="tg">${esc((a.problem.track || 'lld').toUpperCase())}</span><span class="m">${a.status === 'done' ? esc(a.signal || 'Finished') : `Step ${a.step} of ${a.steps || '?'}`}${s != null ? ` · avg ${s}/10` : ''}</span></a>`; }).join('')}</div>`
      : `<p class="hint">No interviews yet. <a href="../practice/">Start your first one</a>.</p>`);
  }
</script>
</body>
</html>
