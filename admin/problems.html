<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="icon" type="image/png" href="../assets/favicon.png">
<link rel="apple-touch-icon" href="../assets/apple-touch-icon.png">
<script src="../assets/theme.js"></script>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Practice problems — Admin</title>
<meta name="robots" content="noindex, nofollow">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../courses/courses.css">
<style>
  .layout{display:grid;grid-template-columns:260px minmax(0,1fr);flex:1;min-height:0}
  .side{border-right:1px solid var(--border);background:var(--bg);padding:16px 12px;display:flex;flex-direction:column;gap:4px}
  .side h3{font:500 13px var(--mono);color:var(--muted);margin:4px 8px 8px}
  .side .c{display:block;width:100%;text-align:left;padding:9px 10px;border-radius:6px;background:none;border:0;cursor:pointer;font-size:14px}
  .side .c:hover{background:var(--panel2)}
  .side .c.on{background:var(--panel2);box-shadow:inset 3px 0 0 var(--accent)}
  .side .c small{display:block;color:var(--muted);font:12px var(--mono)}
  .main{padding:22px clamp(16px,3vw,36px) 60px;min-width:0;max-width:980px}
  .head{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:18px}
  .head h1{font:600 22px var(--sans);margin:0;margin-right:auto}
  .dirty{font:12px var(--mono);color:var(--warn)}
  .fields{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:14px;margin-bottom:22px}
  label{display:flex;flex-direction:column;gap:6px;font:500 13px var(--mono);color:var(--muted)}
  label.wide{grid-column:1/-1}
  input,select,textarea{background:var(--panel);border:1.5px solid var(--border);border-radius:6px;padding:9px 11px;color:var(--text);font:14px var(--sans);width:100%}
  textarea{resize:vertical;min-height:90px;line-height:1.5;font-family:var(--mono);font-size:13px}
  input:focus,select:focus,textarea:focus{outline:none;border-color:var(--accent)}
  .check{flex-direction:row;align-items:center;gap:10px;color:var(--text);padding-top:24px}
  .check input{width:18px;height:18px;accent-color:var(--accent)}
  h2{font:600 16px var(--sans);margin:8px 0 4px}
  .hint{color:var(--muted);font-size:13.5px;margin:0 0 14px}
  .rub{display:grid;gap:14px}
  .btn.danger{color:var(--err);border-color:var(--err)}
  .gate{max-width:480px;margin:60px auto;background:var(--panel);border:1.5px solid var(--border);border-radius:8px;padding:28px;text-align:center;color:var(--muted);display:flex;flex-direction:column;gap:12px;align-items:center}
  .gate b{color:var(--text);font-size:18px}
  @media (max-width:860px){ .layout{grid-template-columns:1fr} .side{border-right:0;border-bottom:1px solid var(--border)} }
</style>
</head>
<body>
<header>
  <a class="brand" href="../"><div class="logo">YTB</div><b>yourtechbuddy</b></a>
  <nav>
    <a href="./">admin</a>
    <a href="problems.html" class="active">problems</a>
    <a href="../planner/">planner</a>
    <a href="../ideas/">ideas</a>
  </nav>
  <div id="auth"></div>
</header>
<div id="app" style="flex:1;display:flex;flex-direction:column"></div>

<script src="../assets/config.js"></script>
<script src="../assets/ytb.js"></script>
<script>
  const { esc } = YTB;
  const app = document.getElementById('app');
  const RUBS = {
    lld: [
      ['requirements', 'Requirements checklist'],
      ['entities', 'Entities checklist'],
      ['uml', 'UML + patterns checklist'],
      ['code', 'Implementation checklist (also used to judge the twist answer)'],
      ['twist', 'Follow-up ideas (the AI picks or adapts one for each candidate)'],
    ],
    hld: [
      ['requirements', 'Requirements checklist'],
      ['estimation', 'Capacity estimation checklist'],
      ['api', 'APIs + data model checklist'],
      ['architecture', 'Architecture checklist'],
      ['deepdive', 'Scale & trade-offs checklist (also used to judge the twist answer)'],
      ['twist', 'Follow-up ideas (the AI picks or adapts one for each candidate)'],
    ],
  };
  let problems = [], cur = null, dirty = false;
  const blank = () => ({ _orig: null, track: new URLSearchParams(location.search).get('track') === 'hld' ? 'hld' : 'lld', slug: '', title: '', difficulty: 'Medium', summary: '', statement: '', published: false, position: problems.length, rubric: {} });
  const gate = (h) => { app.innerHTML = `<div class="gate">${h}</div>`; };
  const slugify = (s) => s.toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-+|-+$/g, '').slice(0, 60);
  window.addEventListener('beforeunload', (e) => { if (dirty) { e.preventDefault(); e.returnValue = ''; } });

  (async () => {
    if (!YTB.apiOn || !YTB.authOn) return gate('<b>Needs the API</b>');
    if (!YTB.user) { gate('<b>Admin sign-in</b><div id="gsi"></div>'); return YTB.renderGoogleButton(document.getElementById('gsi'), { size: 'large' }); }
    if (!YTB.isAdmin) return gate('<b>Not authorised</b>');
    await load();
    const qs = new URLSearchParams(location.search);
    if (qs.get('new')) { open(null); history.replaceState(null, '', 'problems.html'); return; }
    const want = qs.get('p');
    open((problems.find((p) => p.slug === want) || problems[0]) || null);
  })();

  async function load() {
    try { problems = (await YTB.api('/api/admin/problems')).problems; }
    catch (e) { gate(`<b>Couldn't load problems</b><span>${esc(e.message)}${e.status === 404 ? ' — run the practice migration and deploy the API.' : ''}</span>`); throw e; }
  }
  function open(p) { cur = p ? { ...p, _orig: p.slug, rubric: { ...(p.rubric || {}) } } : blank(); dirty = false; render(); }

  function render() {
    app.innerHTML = `
      <div class="layout">
        <aside class="side">
          ${['lld', 'hld'].map((t) => `<h3 style="margin-top:14px">${t.toUpperCase()}</h3>` + problems.filter((p) => (p.track || 'lld') === t).map((p) => `<button class="c ${cur._orig === p.slug ? 'on' : ''}" data-open="${esc(p.slug)}">${esc(p.title)}<small>${esc(p.difficulty)} · ${p.published ? 'live' : 'draft'}</small></button>`).join('')).join('')}
          <button class="btn primary" style="margin-top:8px" data-act="new">+ New problem</button>
        </aside>
        <main class="main">
          <div class="head">
            <h1>${esc(cur.title || 'New problem')}</h1>
            <span class="dirty" id="dirty">${dirty ? 'unsaved changes' : ''}</span>
            ${cur._orig ? `<a class="btn" href="../practice/session.html?p=${encodeURIComponent(cur._orig)}" target="_blank">Try it</a><button class="btn danger" data-act="delete">Delete</button>` : ''}
            <button class="btn primary" data-act="save">Save</button>
          </div>
          <div class="fields">
            <label>Title<input data-f="title" value="${esc(cur.title)}"></label>
            <label>Slug<input data-f="slug" value="${esc(cur.slug)}"></label>
            <label>Interview type<select data-f="track"><option value="lld" ${cur.track !== 'hld' ? 'selected' : ''}>LLD (classes &amp; code)</option><option value="hld" ${cur.track === 'hld' ? 'selected' : ''}>HLD (system design)</option></select></label>
            <label>Difficulty<select data-f="difficulty">${['Easy', 'Medium', 'Hard'].map((d) => `<option ${d === cur.difficulty ? 'selected' : ''}>${d}</option>`).join('')}</select></label>
            <label>Order<input data-f="position" type="number" value="${cur.position || 0}"></label>
            <label class="wide">One-line summary (shown on the problem card)<input data-f="summary" value="${esc(cur.summary)}"></label>
            <label class="wide">Problem statement (what the candidate sees; keep it vague like a real interview)<textarea data-f="statement" style="min-height:130px;font-family:var(--sans);font-size:14px">${esc(cur.statement)}</textarea></label>
            <label class="check"><input type="checkbox" data-f="published" ${cur.published ? 'checked' : ''}> Published</label>
          </div>
          <h2>Hidden checklists</h2>
          <p class="hint">One point per line. Candidates never see these; the AI interviewer uses them to score each step and hint at what's missing.</p>
          <div class="rub">${RUBS[cur.track === 'hld' ? 'hld' : 'lld'].map(([k, label]) => `<label>${label}<textarea data-rub="${k}">${esc((cur.rubric[k] || []).join('\n'))}</textarea></label>`).join('')}</div>
        </main>
      </div>`;
  }
  const setDirty = () => { dirty = true; const d = document.getElementById('dirty'); if (d) d.textContent = 'unsaved changes'; };
  app.addEventListener('input', (e) => {
    const f = e.target.dataset.f, k = e.target.dataset.rub;
    if (k) { cur.rubric[k] = e.target.value.split('\n').map((s) => s.trim()).filter(Boolean); return setDirty(); }
    if (!f) return;
    if (f === 'published') return;
    if (f === 'title' && !cur._orig && (!cur.slug || cur.slug === slugify(cur.title))) { cur.slug = slugify(e.target.value); const s = app.querySelector('[data-f="slug"]'); if (s) s.value = cur.slug; }
    cur[f] = f === 'position' ? (parseInt(e.target.value, 10) || 0) : e.target.value;
    setDirty();
  });
  app.addEventListener('change', (e) => { if (e.target.dataset.f === 'published') { cur.published = e.target.checked; setDirty(); } if (e.target.dataset.f === 'difficulty') { cur.difficulty = e.target.value; setDirty(); } if (e.target.dataset.f === 'track') { cur.track = e.target.value; setDirty(); render(); } });
  app.addEventListener('click', async (e) => {
    const o = e.target.closest('[data-open]');
    if (o) { if (dirty && !confirmTwice(o)) return; return open(problems.find((p) => p.slug === o.dataset.open)); }
    const act = e.target.closest('[data-act]');
    if (!act) return;
    if (act.dataset.act === 'new') { if (dirty && !confirmTwice(act)) return; return open(null); }
    if (act.dataset.act === 'save') return save();
    if (act.dataset.act === 'delete') {
      if (!confirmTwice(act, 'Delete forever? Click again')) return;
      try { await YTB.api('/api/admin/problems/' + encodeURIComponent(cur._orig), { method: 'DELETE' }); await load(); dirty = false; open(problems[0] || null); YTB.toast('Problem deleted'); }
      catch (err) { YTB.toast('Delete failed: ' + err.message); }
    }
  });
  function confirmTwice(btn, label = 'Discard changes? Click again') {
    if (btn.dataset.armed) { delete btn.dataset.armed; return true; }
    btn.dataset.armed = '1'; const t = btn.innerHTML; btn.textContent = label;
    setTimeout(() => { delete btn.dataset.armed; btn.innerHTML = t; }, 2500);
    return false;
  }
  async function save() {
    if (!cur.title.trim()) return YTB.toast('Add a title first');
    if (!cur.slug) cur.slug = slugify(cur.title);
    const { _orig, ...body } = cur;
    try {
      const { problem } = await YTB.api('/api/admin/problems/' + encodeURIComponent(_orig || cur.slug), { method: 'PUT', body });
      await load(); open(problems.find((p) => p.slug === problem.slug));
      history.replaceState(null, '', '?p=' + encodeURIComponent(problem.slug));
      YTB.toast(problem.published ? 'Saved — live on the practice page' : 'Saved as draft');
    } catch (err) { YTB.toast('Save failed: ' + err.message); }
  }
</script>
</body>
</html>
