<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="icon" type="image/png" href="../assets/favicon.png">
<link rel="apple-touch-icon" href="../assets/apple-touch-icon.png">
<script src="../assets/theme.js"></script>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Course — YourTechBuddy</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="courses.css">
<style>
  .layout{display:grid;grid-template-columns:340px minmax(0,1fr);gap:0;flex:1;min-height:0}
  /* collapsible lesson list (desktop) */
  .ah-top{display:flex;align-items:flex-start;gap:8px}
  .ah-top h2{flex:1;min-width:0}
  .list-toggle{width:28px;height:28px;flex:none;border:1px solid transparent;border-radius:7px;background:none;color:var(--faint);display:grid;place-items:center;margin:-4px -6px 0 0}
  .list-toggle:hover{background:var(--panel2);color:var(--text);border-color:var(--border)}
  .list-toggle svg{width:16px;height:16px}
  .list-rail{display:none}
  @media (max-width:980px){.list-toggle{display:none}}
  @media (min-width:981px){
    .layout{transition:grid-template-columns .18s ease}
    .layout.lessons-hidden{grid-template-columns:48px minmax(0,1fr)}
    .layout.lessons-hidden > aside > :not(.list-rail){display:none}
    .layout.lessons-hidden .list-rail{display:flex;flex-direction:column;align-items:center;gap:14px;width:100%;flex:1;padding:68px 0 18px;border:0;background:none;color:var(--muted);cursor:pointer}
    .list-rail:hover{background:var(--panel2);color:var(--text)}
    .list-rail svg{width:18px;height:18px;padding:5px;box-sizing:content-box;border:1px solid var(--border-strong);border-radius:50%;background:var(--panel)}
    .list-rail:hover svg{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
    .list-rail span{writing-mode:vertical-rl;font:600 13.5px var(--sans);letter-spacing:.02em;display:flex;gap:8px;align-items:center}
    .list-rail b{font:500 12px var(--mono);color:var(--faint)}
    .layout.lessons-hidden .stage{max-width:1100px}
  }
  .stage{padding:24px clamp(16px,3vw,32px) 40px;min-width:0;max-width:960px}
  .player-wrap{position:relative;aspect-ratio:16/9;width:100%;max-width:min(880px,calc((100vh - 290px) * 16 / 9));min-width:min(100%,480px);background:#000;border-radius:4px;overflow:hidden;border:1.5px solid var(--text)}
  .player-wrap > div, .player-wrap iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
  .placeholder{position:absolute;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;gap:12px;text-align:center;padding:24px;background:var(--panel)}
  .placeholder.show{display:flex}
  .placeholder h3{margin:0;font-size:20px}
  .placeholder p{margin:0;color:var(--muted)}
  .crumb{font-size:13px;color:var(--muted);margin:18px 0 4px}
  .crumb a{color:var(--muted)}
  h1{font-size:clamp(20px,2.4vw,26px);margin:0 0 16px;letter-spacing:-.015em}
  /* module quiz */
  .stage.quiz-mode > :not(#quiz){display:none!important}
  .quiz{display:flex;flex-direction:column;gap:18px;max-width:760px}
  .quiz .qcrumb{font-size:13.5px;color:var(--muted)}
  .quiz h1{margin:0;font:600 26px/1.25 var(--sans)}
  .quiz .qmeta{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
  .qdots{display:flex;gap:6px}
  .qdots i{width:26px;height:6px;border-radius:99px;background:var(--panel3)}
  .qdots i.ok{background:var(--ok)} .qdots i.bad{background:var(--err)} .qdots i.cur{background:var(--accent)}
  .qcard{background:var(--panel);border:1px solid var(--border);border-radius:var(--r);padding:20px 22px;display:flex;flex-direction:column;gap:14px;box-shadow:var(--shadow)}
  .qcard .qn{font:600 12.5px var(--sans);color:var(--faint)}
  .qcard .qq{font:600 18px/1.45 var(--sans);margin:0}
  .qopts{display:grid;gap:10px}
  .qopt{display:flex;align-items:flex-start;gap:12px;text-align:left;width:100%;padding:12px 14px;border:1px solid var(--border-strong);border-radius:var(--r-sm);background:var(--panel);font:15px/1.45 var(--sans);color:var(--text);transition:border-color .12s,background .12s}
  .qopt:hover:not(:disabled){border-color:var(--accent);background:var(--accent-soft)}
  .qopt .k{flex:none;width:24px;height:24px;border-radius:50%;border:1px solid var(--border-strong);display:grid;place-items:center;font:600 12px var(--mono);color:var(--muted)}
  .qopt:disabled{cursor:default}
  .qopt.right{border-color:var(--ok);background:var(--ok-soft)} .qopt.right .k{background:var(--ok);border-color:var(--ok);color:var(--on-accent)}
  .qopt.wrong{border-color:var(--err);background:var(--err-soft)} .qopt.wrong .k{background:var(--err);border-color:var(--err);color:#fff}
  .qwhy{padding:12px 14px;border-radius:var(--r-sm);background:var(--panel2);font-size:14.5px;line-height:1.55}
  .qwhy b{display:block;margin-bottom:2px}
  .qwhy.ok b{color:var(--ok)} .qwhy.bad b{color:var(--err)}
  .qacts{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
  .qacts .sp{flex:1}
  .qscore{display:flex;align-items:center;gap:18px;flex-wrap:wrap}
  .qscore .big{font:700 44px/1 var(--mono)}
  .qscore .big small{font-size:20px;color:var(--muted)}
  .qscore p{margin:0;color:var(--muted);max-width:46ch}
  .qreview{display:grid;gap:8px;margin:0;padding:0;list-style:none}
  .qreview li{display:flex;gap:10px;font-size:14px;line-height:1.5}
  .qreview li i{flex:none;font-style:normal;font-weight:700}
  .qreview li.ok i{color:var(--ok)} .qreview li.bad i{color:var(--err)}
  .qreview small{display:block;color:var(--muted)}
  /* quiz row in the lesson list */
  .lesson.quiz-row .n{background:var(--accent-soft);border-color:var(--accent);color:var(--accent)}
  .lesson.quiz-row.passed .n{background:var(--ok);border-color:var(--ok);color:var(--on-accent)}
  @media (max-width:640px){ .qcard{padding:16px} .quiz h1{font-size:22px} .qacts .btn{flex:1} .qacts .sp{display:none} }
  .lcode{margin-top:28px;padding-top:22px;border-top:1px solid var(--border);display:flex;flex-direction:column;gap:14px;scroll-margin-top:16px}
  .lcode-h{display:flex;align-items:center;gap:10px;flex-wrap:wrap;order:2}
  #lcode-view{order:1}
  .lcode-h h2{margin:0;font:600 18px var(--sans)}
  .actions{display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center;justify-content:space-between}
  .nav3,.more3{display:flex;gap:8px;flex-wrap:wrap}
  .more3 .btn{border:1px solid var(--border)}
  @media (max-width:640px){
    .actions{flex-direction:column;align-items:stretch}
    .nav3{display:grid;grid-template-columns:1fr 1.4fr 1fr}
    .more3{display:grid;grid-template-columns:repeat(2,minmax(0,1fr))}
    .nav3 .btn,.more3 .btn{padding:10px 6px;font-size:13.5px;white-space:normal;text-align:center;line-height:1.25;min-height:44px}
  }

  .layout > aside{order:-1;border-right:1px solid var(--border);background:var(--panel);display:flex;flex-direction:column;min-height:0;max-height:100vh;position:sticky;top:0}
  .aside-head{padding:18px 18px 14px;border-bottom:1px solid var(--border)}
  .aside-head h2{font-size:16px;margin:0 0 10px}
  .aside-head .meta{display:flex;justify-content:space-between;font-size:12px;color:var(--muted);margin-top:8px}
  .list{overflow:auto;flex:1;padding:6px 0 20px}
  .sec{display:flex;align-items:center;gap:8px;width:100%;padding:12px 18px;background:none;border:0;border-top:1px solid var(--border);font:600 13px var(--mono);color:var(--text);cursor:pointer;text-align:left}
  .grp:first-child .sec{border-top:0}
  .sec:hover{background:var(--panel2)}
  .sec:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}
  .sec .chev{flex:none;width:12px;color:var(--accent);transition:transform .15s}
  .grp:not(.open) .sec .chev{transform:rotate(-90deg)}
  .sec .st{flex:1;min-width:0}
  .sec .cnt{flex:none;font-weight:500;font-size:12px;color:var(--muted)}
  .grp.has-cur .sec .st{color:var(--accent)}
  .grp:not(.open) .kids{display:none}
  .grp .kids{padding-bottom:6px}
  .lesson{display:flex;gap:10px;align-items:flex-start;padding:9px 18px;text-decoration:none;font-size:14px;border-left:3px solid transparent}
  .lesson:hover{background:var(--panel2)}
  .lesson.current{background:var(--panel2);border-left-color:var(--accent)}
  .lesson .n{flex:none;width:22px;height:22px;border-radius:50%;display:grid;place-items:center;font:600 11px var(--mono);border:1px solid var(--border);color:var(--muted);margin-top:1px}
  .lesson.done .n{background:var(--ok);border-color:var(--ok);color:var(--on-accent)}
  .lesson .t{flex:1;min-width:0}
  .lesson .d{font-size:12px;color:var(--muted)}
  .lesson.locked{color:var(--muted)}

  @media (max-width:980px){
    .layout{grid-template-columns:minmax(0,1fr)}
    .layout > aside{order:0;border-right:0;border-top:1px solid var(--border);position:static;max-height:none}
  }
</style>
</head>
<body>
<header>
  <a class="brand" href="../"><div class="logo">YTB</div><b>yourtechbuddy</b></a>
  <nav>
    <a href="../playground/">playground</a>
    <a href="./" class="active">courses</a>
    <a href="../practice/">practice</a>
    <a class="yt" href="https://www.youtube.com/@yourtechbuddy101" target="_blank" rel="noopener">youtube</a>
  </nav>
  <div id="auth"></div>
</header>

<div class="layout" id="layout">
  <main class="stage" id="stage">
    <section class="quiz" id="quiz" hidden aria-live="polite"></section>
    <div class="player-wrap">
      <div id="player"></div>
      <div class="placeholder" id="placeholder">
        <h3>🎬 Coming soon</h3>
        <p>This lesson hasn't been published yet. Subscribe so you don't miss it.</p>
        <a class="btn primary" href="https://www.youtube.com/@yourtechbuddy101?sub_confirmation=1" target="_blank" rel="noopener">Subscribe on YouTube</a>
      </div>
    </div>

    <div class="crumb"><a href="./">Courses</a> / <span id="crumb-course"></span> / <span id="crumb-sec"></span></div>
    <h1 id="title">Loading…</h1>

    <div class="actions">
      <div class="nav3">
        <button class="btn" id="prev">← Previous</button>
        <button class="btn" id="mark">✓ Mark complete</button>
        <button class="btn primary" id="next">Next →</button>
      </div>
      <div class="more3">
        <a class="btn ghost" id="mock" hidden>Mock interview</a>
        <a class="btn ghost" id="practice" hidden>Practise in Playground</a>
        <a class="btn ghost" id="lesson-code" href="#lcode" hidden>Jump to code ↓</a>
        <a class="btn ghost" id="on-yt" target="_blank" rel="noopener">YouTube ↗</a>
      </div>
    </div>
    <section class="lcode" id="lcode" hidden aria-label="Code and notes for this lesson">
      <div class="lcode-h"><span class="chip" id="lcode-topic"></span></div>
      <div id="lcode-view"><div class="skel" style="height:280px"></div></div>
    </section>
  </main>

  <aside>
    <button class="list-rail" data-lessons-toggle aria-label="Show lesson list" title="Show lesson list"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m9 18 6-6-6-6"/></svg><span>Lessons<b id="rail-count"></b></span></button>
    <div class="aside-head">
      <div class="ah-top"><h2 id="course-title"></h2><button class="list-toggle" data-lessons-toggle aria-label="Hide lesson list" title="Hide lesson list"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"/></svg></button></div>
      <div class="progress"><i id="bar" style="width:0%"></i></div>
      <div class="meta"><span id="done-count"></span><span id="pct"></span></div>
    </div>
    <div class="list" id="list"></div>
  </aside>
</div>

<script src="../assets/config.js"></script>
<script src="courses.js"></script>
<script src="../assets/ytb.js"></script>
<script src="../assets/tracks.js"></script>
<script src="../assets/lldcode.js"></script>
<script src="../assets/codeview.js"></script>
<script>
  const $ = (id) => document.getElementById(id);
  const esc = YTB.esc;
  const store = {
    get(k, d) { try { const v = JSON.parse(localStorage.getItem(k)); return v ?? d; } catch { return d; } },
    set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} },
  };
  const clamp = (n, a, b) => Math.max(a, Math.min(b, n));

(async () => {
  const params = new URLSearchParams(location.search);
  const course = (await YTB.getCourse(params.get('c'))) || (await YTB.getCourses())[0];
  if (!course) { $('title').textContent = 'Course not found.'; return; }
  const titles = store.get('ytb:titles', {});
  let done = await YTB.progress.load(course);
  let lessons = [], total = 0, liveCount = 0, idx = 1, playlistIds = [];

  function setLessons(list) {
    lessons = list; total = list.length; liveCount = list.filter((l) => l.youtube).length;
    store.set('ytb:count:' + course.slug, liveCount);
  }
  const urlFor = (n) => { const l = lessons[n - 1]; return `?c=${course.slug}&` + (l && l.youtube ? `v=${l.youtube}` : `l=${n}`); };
  function idxFromUrl(p) {
    const v = p.get('v');
    if (v) { const i = lessons.findIndex((l) => l.youtube === v); if (i >= 0) return i + 1; }
    return clamp(parseInt(p.get('l'), 10) || firstUnfinished(), 1, total);
  }
  // Groups playlist videos into sections by keywords in their titles (see `groups` in courses.js).
  function buildPlaylistLessons() {
    const cur = lessons[idx - 1] && lessons[idx - 1].youtube;
    const allKnown = playlistIds.every((id) => titles[id]);
    let list;
    if (course.groups && allKnown) {
      const buckets = course.groups.map((g) => ({ title: g.title, items: [] }));
      const more = { title: course.fallbackGroup || 'More lessons', items: [] };
      const order = course.groupPriority || course.groups.map((_, i) => i);
      playlistIds.forEach((id) => {
        const t = titles[id].toLowerCase();
        const gi = order.find((i) => course.groups[i].match.some((k) => t.includes(k)));
        (gi !== undefined ? buckets[gi] : more).items.push(id);
      });
      list = [...buckets, more].filter((b) => b.items.length)
        .flatMap((b) => b.items.map((id) => ({ title: titles[id], youtube: id, section: b.title })));
    } else {
      list = playlistIds.map((id, i) => ({ title: titles[id] || `Lesson ${i + 1}`, youtube: id, section: course.title }));
    }
    setLessons(list);
    if (cur) idx = (lessons.findIndex((l) => l.youtube === cur) + 1) || 1;
  }
  function firstUnfinished() {
    const i = lessons.findIndex((l) => l.youtube && !done.has(l.youtube));
    return i >= 0 ? i + 1 : 1;
  }

  // Playlist mode: lessons come live from the YouTube playlist (new uploads appear automatically).
  const playlistMode = !!course.playlist && !(course.sections || []).some((s) => s.lessons.length);
  if (!playlistMode) {
    setLessons(course.sections.flatMap((s) => s.lessons.map((l) => ({ ...l, section: s.title }))));
  }

  document.title = `${course.title} — YourTechBuddy`;
  $('course-title').textContent = course.title;
  $('crumb-course').textContent = course.title;

  /* ---------- Sidebar ---------- */
  let openSecs = new Set(), lastCurSec = null;
  function renderList() {
    const curSec = lessons[idx - 1]?.section;
    // When the playing lesson moves to another group, show only that group.
    if (curSec !== lastCurSec) { openSecs = new Set([curSec]); lastCurSec = curSec; }
    const secs = [];
    lessons.forEach((l, i) => {
      if (!secs.length || secs[secs.length - 1].title !== l.section) secs.push({ title: l.section, items: [] });
      secs[secs.length - 1].items.push([l, i + 1]);
    });
    let html = '';
    secs.forEach((s, si) => {
      const open = openSecs.has(s.title), hasCur = s.title === curSec;
      const nDone = s.items.filter(([l]) => l.youtube && done.has(l.youtube)).length;
      html += `<div class="grp ${open ? 'open' : ''} ${hasCur ? 'has-cur' : ''}">
        <button class="sec" data-sec="${si}" aria-expanded="${open}"><span class="chev">▾</span><span class="st">${esc(s.title)}</span><span class="cnt">${nDone ? nDone + '/' : ''}${s.items.length}</span></button>
        <div class="kids">`;
      s.items.forEach(([l, n]) => {
        const isDone = l.youtube && done.has(l.youtube);
        const cls = ['lesson', n === idx && !quizOn ? 'current' : '', isDone ? 'done' : '', l.youtube ? '' : 'locked'].join(' ');
        html += `<a class="${cls}" href="${urlFor(n)}" data-l="${n}">
          <span class="n">${isDone ? '✓' : n}</span>
          <span class="t">${esc(l.title)}${l.duration ? `<div class="d">${esc(l.duration)}</div>` : ''}</span>
          ${l.youtube ? '' : '<span class="soon">soon</span>'}
        </a>`;
      });
      const qm = quizFor(s.title);
      if (qm) {
        const best = quizBest(qm), passed = best && best.score / best.total * 100 >= passPct;
        html += `<a class="lesson quiz-row ${quizOn && quizOn.title === s.title ? 'current' : ''} ${passed ? 'passed' : ''}" href="?c=${course.slug}&quiz=${quizSlug(qm)}" data-quiz="${esc(s.title)}">
          <span class="n">${passed ? '✓' : '?'}</span>
          <span class="t">Module quiz<div class="d">${qm.questions.length} questions${best ? ` · best ${best.score}/${best.total}` : ''}</div></span></a>`;
      }
      html += '</div></div>';
    });
    renderList.secs = secs;
    $('list').innerHTML = html;
    $('rail-count').textContent = lessons.length ? ' · ' + lessons.length : '';
    const count = lessons.filter((l) => l.youtube && done.has(l.youtube)).length;
    const pct = liveCount ? Math.round((count / liveCount) * 100) : 0;
    $('bar').style.width = pct + '%';
    $('done-count').textContent = `${count} / ${liveCount} completed`;
    $('pct').textContent = pct + '%';
    const cur = $('list').querySelector('.current');
    if (cur) cur.scrollIntoView({ block: 'nearest' });
  }
  $('list').addEventListener('click', (e) => {
    const sb = e.target.closest('.sec[data-sec]');
    if (sb) {
      const title = renderList.secs[+sb.dataset.sec].title, grp = sb.parentElement;
      const open = !grp.classList.contains('open');
      open ? openSecs.add(title) : openSecs.delete(title);
      grp.classList.toggle('open', open); sb.setAttribute('aria-expanded', String(open));
      return;
    }
    const qa = e.target.closest('a[data-quiz]');
    if (qa) { e.preventDefault(); openQuiz(qa.dataset.quiz, true); return; }
    const a = e.target.closest('a[data-l]');
    if (!a) return;
    e.preventDefault();
    go(parseInt(a.dataset.l, 10), true, true);
  });

  /* ---------- Player (YouTube IFrame API, privacy-enhanced domain) ---------- */
  let player = null, playerReady = false, pendingId = null;
  window.onYouTubeIframeAPIReady = () => {
    const vars = { rel: 0, modestbranding: 1, playsinline: 1 };
    if (playlistMode) { vars.listType = 'playlist'; vars.list = course.playlist; }
    const opts = {
      host: 'https://www.youtube-nocookie.com',
      playerVars: vars,
      events: {
        onReady: () => {
          playerReady = true;
          if (playlistMode) waitForPlaylist();
          else if (pendingId) { player.cueVideoById(pendingId); pendingId = null; }
        },
        onError: (e) => { if (playlistMode && !lessons.length) playlistFailed(`YouTube error ${e.data}`); },
        onStateChange: (e) => {
          if (e.data === YT.PlayerState.PLAYING) cacheCurrentTitle();
          if (e.data === YT.PlayerState.ENDED) onEnded();
        },
      },
    };
    // Only pass videoId when we actually have one (YouTube rejects an empty/undefined id).
    if (!playlistMode && pendingId) { opts.videoId = pendingId; pendingId = null; }
    if (playlistMode && !/^(PL|UU|OL|FL|RD|LL)[A-Za-z0-9_-]{10,}$/.test(course.playlist)) {
      playlistFailed('invalid playlist id'); return;
    }
    try { player = new YT.Player('player', opts); }
    catch (err) { console.warn('[YTB] player error:', err); if (playlistMode) playlistFailed(String(err)); }
  };
  const s = document.createElement('script');
  s.src = 'https://www.youtube.com/iframe_api';
  document.head.appendChild(s);

  function waitForPlaylist(tries = 0) {
    const ids = player.getPlaylist && player.getPlaylist();
    if (ids && ids.length) {
      playlistIds = ids;
      buildPlaylistLessons();
      idx = idxFromUrl(params);
      history.replaceState(null, '', urlFor(idx));
      render();
      fetchTitles(ids);
      return;
    }
    if (tries > 40) { playlistFailed('timed out'); return; }
    setTimeout(() => waitForPlaylist(tries + 1), 250);
  }

  let failed = false;
  function playlistFailed(reason) {
    if (failed || lessons.length) return;
    failed = true;
    console.warn('[YTB] playlist load failed:', reason, course.playlist);
    $('title').textContent = "Couldn't load this course's playlist.";
    $('crumb-sec').textContent = `Check the playlist ID in courses.js (${course.playlist.length} chars — full IDs are usually 34)`;
    $('on-yt').style.display = ''; $('on-yt').textContent = 'Open playlist on YouTube ↗';
    $('on-yt').href = `https://www.youtube.com/playlist?list=${encodeURIComponent(course.playlist)}`;
  }
  // Safety net: if the YouTube API never even becomes ready (blocked, offline), don't spin forever.
  if (playlistMode) setTimeout(() => playlistFailed('player never became ready'), 15000);

  function cacheCurrentTitle() {
    const d = player.getVideoData && player.getVideoData();
    if (d && d.video_id && d.title && titles[d.video_id] !== d.title) {
      titles[d.video_id] = d.title; store.set('ytb:titles', titles); applyTitles();
    }
  }
  async function fetchTitles(ids) {
    const missing = ids.filter((id) => !titles[id]);
    for (let i = 0; i < missing.length; i += 6) {
      await Promise.all(missing.slice(i, i + 6).map(async (id) => {
        try {
          const r = await fetch('https://noembed.com/embed?url=' + encodeURIComponent('https://www.youtube.com/watch?v=' + id));
          const j = await r.json();
          if (j && j.title) titles[id] = j.title;
        } catch {}
      }));
      store.set('ytb:titles', titles);
      applyTitles();
    }
  }
  function applyTitles() {
    if (playlistMode) { buildPlaylistLessons(); history.replaceState(null, '', urlFor(idx)); }
    else lessons.forEach((l) => { if (l.youtube && titles[l.youtube]) l.title = titles[l.youtube]; });
    renderText(); renderList();
  }

  function showVideo(id, autoplay) {
    $('placeholder').classList.toggle('show', !id);
    if (!id) { if (player && player.pauseVideo) player.pauseVideo(); return; }
    if (!playerReady) { pendingId = id; return; }
    autoplay ? player.loadVideoById(id) : player.cueVideoById(id);
  }

  function onEnded() {
    const l = lessons[idx - 1];
    if (l && l.youtube && !done.has(l.youtube)) { done.add(l.youtube); YTB.progress.set(course, l.youtube, true); }
    const nextLive = lessons.findIndex((x, i) => i >= idx && x.youtube);
    if (nextLive >= 0) go(nextLive + 1, true, true); else { renderText(); renderList(); }
  }

  /* ---------- Lesson rendering ---------- */
  function renderText() {
    const l = lessons[idx - 1];
    if (!l) return;
    $('title').textContent = `${idx}. ${l.title}`;
    $('crumb-sec').textContent = l.section;
    $('prev').disabled = idx <= 1;
    $('next').disabled = idx >= total && !quizFor(l.section);
    const isDone = l.youtube && done.has(l.youtube);
    $('mark').disabled = !l.youtube;
    $('mark').textContent = isDone ? '✓ Completed' : '✓ Mark complete';
    $('mark').classList.toggle('done', !!isDone);
    $('on-yt').style.display = l.youtube ? '' : 'none';
    if (l.youtube) $('on-yt').href = `https://www.youtube.com/watch?v=${encodeURIComponent(l.youtube)}` + (course.playlist ? `&list=${course.playlist}` : '');
    // Only lesson-specific actions: a playground language set on this lesson, and a mock interview for this exact topic
    $('practice').hidden = !l.practice;
    if (l.practice) $('practice').href = `../playground/#lang=${encodeURIComponent(l.practice)}`;
    showLessonMock(l.title);
    showLessonCode(l.title);
  }
  /* ---------- Module quizzes: courses/quizzes/<course>.json, matched to modules by name ---------- */
  let quizData = null, passPct = 70, quizOn = null;
  async function loadQuizzes() {
    try {
      const r = await fetch(`quizzes/${encodeURIComponent(course.slug)}.json`, { cache: 'no-cache' });
      quizData = r.ok ? await r.json() : null;
    } catch { quizData = null; }
    passPct = (quizData && quizData.passPct) || 70;
    renderList();
  }
  const quizKeys = (m) => [m.module, ...(m.aliases || [])];
  const quizMemo = {};
  function quizFor(sectionTitle) {
    if (!quizData || !sectionTitle) return null;
    if (sectionTitle in quizMemo) return quizMemo[sectionTitle];
    const ms = quizData.modules || [];
    const n = (s) => String(s).toLowerCase().trim();
    const m = ms.find((x) => quizKeys(x).some((k) => n(k) === n(sectionTitle))) || YTB.match(sectionTitle, ms, quizKeys);
    return (quizMemo[sectionTitle] = m ? { ...m, section: sectionTitle, title: sectionTitle } : null);
  }
  const quizSlug = (m) => YTB.words(m.module).join('-');
  function quizBySlug(slug) {
    const secs = [...new Set(lessons.map((l) => l.section))];
    for (const s of secs) { const m = quizFor(s); if (m && quizSlug(m) === slug) return m; }
    return null;
  }
  const bestKey = (m) => `ytb:quiz:${course.slug}:${quizSlug(m)}`;
  const quizBest = (m) => YTB.LS.get(bestKey(m), null);
  const shuffle = (a) => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };

  function openQuiz(sectionTitle, push) {
    const m = quizFor(sectionTitle); if (!m) return;
    quizOn = { title: sectionTitle, m, i: 0, picks: [], order: m.questions.map((q) => shuffle(q.options.map((_, k) => k))) };
    if (player && playerReady && player.pauseVideo) { try { player.pauseVideo(); } catch {} }
    if (push) history.pushState(null, '', `?c=${course.slug}&quiz=${quizSlug(m)}`);
    $('stage').classList.add('quiz-mode'); $('quiz').hidden = false;
    document.title = `Quiz: ${sectionTitle} — ${course.title}`;
    drawQuiz(); renderList(); window.scrollTo({ top: 0, behavior: 'smooth' });
  }
  function closeQuiz() {
    if (!quizOn) return;
    quizOn = null; $('stage').classList.remove('quiz-mode'); $('quiz').hidden = true;
    document.title = `${course.title} — YourTechBuddy`;
  }
  function moduleBounds(title) {
    const first = lessons.findIndex((l) => l.section === title) + 1;
    let last = first; while (last < total && lessons[last].section === title) last++;
    return { first, last, next: last < total ? last + 1 : null };
  }
  function drawQuiz() {
    const Q = quizOn, m = Q.m, qs = m.questions, b = moduleBounds(Q.title);
    const dots = qs.map((q, k) => `<i class="${k < Q.picks.length ? (Q.picks[k] === q.answer ? 'ok' : 'bad') : k === Q.i ? 'cur' : ''}"></i>`).join('');
    const head = `<div class="qcrumb">${esc(course.title)} / ${esc(Q.title)}</div><h1>Module quiz: ${esc(Q.title)}</h1>`;
    if (Q.i >= qs.length) {
      const score = Q.picks.filter((p, k) => p === qs[k].answer).length, pct = Math.round(score / qs.length * 100);
      const prev = quizBest(m);
      if (!prev || score > prev.score) YTB.LS.set(bestKey(m), { score, total: qs.length, at: Date.now() });
      const passed = pct >= passPct;
      $('quiz').innerHTML = `${head}
        <div class="qmeta"><div class="qdots">${dots}</div></div>
        <div class="qcard">
          <div class="qscore"><span class="big">${score}<small>/${qs.length}</small></span>
            <p>${passed ? (score === qs.length ? 'Perfect score. You have this module nailed.' : 'Nice work, you passed this module.') : `You need ${Math.ceil(qs.length * passPct / 100)} to pass. Rewatch the lessons you missed and try again.`}</p></div>
          <ul class="qreview">${qs.map((q, k) => { const ok = Q.picks[k] === q.answer; return `<li class="${ok ? 'ok' : 'bad'}"><i>${ok ? '✓' : '✗'}</i><span>${esc(q.q)}${ok ? '' : `<small>Answer: ${esc(q.options[q.answer])}</small>`}</span></li>`; }).join('')}</ul>
          <div class="qacts">
            <button class="btn" data-qact="retry">Retry quiz</button>
            <button class="btn" data-qact="rewatch">Rewatch module</button>
            <span class="sp"></span>
            ${b.next ? `<button class="btn primary" data-qact="next">Next module →</button>` : `<a class="btn primary" href="./">Back to courses</a>`}
          </div>
        </div>`;
      renderList();
      return;
    }
    const q = qs[Q.i], picked = Q.picks.length > Q.i ? Q.picks[Q.i] : null, order = Q.order[Q.i];
    $('quiz').innerHTML = `${head}
      <div class="qmeta"><div class="qdots">${dots}</div><span class="note">Question ${Q.i + 1} of ${qs.length}</span></div>
      <div class="qcard">
        <p class="qq">${esc(q.q)}</p>
        <div class="qopts">${order.map((k, pos) => `<button class="qopt ${picked !== null ? (k === q.answer ? 'right' : k === picked ? 'wrong' : '') : ''}" data-opt="${k}" ${picked !== null ? 'disabled' : ''}><span class="k">${'ABCD'[pos]}</span><span>${esc(q.options[k])}</span></button>`).join('')}</div>
        ${picked !== null ? `<div class="qwhy ${picked === q.answer ? 'ok' : 'bad'}"><b>${picked === q.answer ? 'Correct' : 'Not quite'}</b>${esc(q.why || '')}</div>` : ''}
        <div class="qacts">
          <button class="btn" data-qact="rewatch">Back to lessons</button>
          <span class="sp"></span>
          ${picked !== null ? `<button class="btn primary" data-qact="advance">${Q.i + 1 < qs.length ? 'Next question' : 'See my score'}</button>` : '<span class="note">Pick an answer (keys 1–4)</span>'}
        </div>
      </div>`;
  }
  $('quiz').addEventListener('click', (e) => {
    const o = e.target.closest('[data-opt]');
    if (o && !o.disabled) { quizOn.picks[quizOn.i] = +o.dataset.opt; return drawQuiz(); }
    const a = e.target.closest('[data-qact]')?.dataset.qact; if (!a) return;
    const b = moduleBounds(quizOn.title);
    if (a === 'advance') { quizOn.i++; drawQuiz(); $('quiz').scrollIntoView({ block: 'start' }); }
    else if (a === 'retry') openQuiz(quizOn.title, false);
    else if (a === 'rewatch') go(b.first, true, false);
    else if (a === 'next') go(b.next, true, true);
  });
  document.addEventListener('keydown', (e) => {
    if (!quizOn || e.target.closest('input,textarea')) return;
    const n = parseInt(e.key, 10);
    if (n >= 1 && n <= 4) { const btn = $('quiz').querySelectorAll('[data-opt]')[n - 1]; if (btn && !btn.disabled) btn.click(); }
    if (e.key === 'Enter') { const adv = $('quiz').querySelector('[data-qact="advance"]'); if (adv) adv.click(); }
  });

  /* ---------- Collapsible lesson list (remembered) ---------- */
  const setListHidden = (hidden) => { $('layout').classList.toggle('lessons-hidden', hidden); YTB.LS.set('ytb:lessons-hidden', hidden ? 1 : 0); $('rail-count').textContent = lessons.length ? ' · ' + lessons.length : ''; };
  setListHidden(!!YTB.LS.get('ytb:lessons-hidden', 0));
  document.addEventListener('click', (e) => { if (e.target.closest('[data-lessons-toggle]')) setListHidden(!$('layout').classList.contains('lessons-hidden')); });

  /* ---------- Mock interview for this lesson (only when one exists for this topic) ---------- */
  let probList = null, mockFor = null;
  async function showLessonMock(title) {
    mockFor = title; $('mock').hidden = true;
    if (!YTB.apiOn || /pattern/i.test(title)) return; // pattern lessons use a design as an example; they aren't that design
    if (!probList) probList = YTB.api('/api/practice/problems').then((r) => r.problems).catch(() => []);
    const ps = await probList;
    if (mockFor !== title) return;
    const keys = (p) => [p.title.replace(/\(.*\)/, ''), (p.title.match(/\((.*)\)/) || [])[1], p.slug.replace(/-/g, ' ')].filter(Boolean);
    const own = ps.filter((p) => YTBTracks.get(p.track).course === course.slug); // prefer this course's own track
    const p = YTB.match(title, own, keys) || YTB.match(title, ps, keys);
    if (!p) return;
    $('mock').href = `../practice/session.html?p=${encodeURIComponent(p.slug)}`;
    $('mock').textContent = `Mock interview: ${p.title.replace(/\s*\(.*\)$/, '')}`;
    $('mock').hidden = false;
  }

  /* ---------- Code for this lesson (live from the course repo on GitHub) ---------- */
  let codeFor = null;
  async function showLessonCode(title) {
    if (codeFor === title) return;
    codeFor = title;
    const t = await LLDCode.forLesson(title);
    if (codeFor !== title) return;
    if (!t && !(await LLDCode.load())) {
      // GitHub unreachable: no saved copy, just the link
      $('lesson-code').hidden = true; $('lcode').hidden = false; $('lcode-topic').textContent = '';
      $('lcode-view').innerHTML = `<p class="note">Couldn't load the code from GitHub right now. <a href="${LLDCode.github()}" target="_blank" rel="noopener">View the course code on GitHub ↗</a></p>`;
      return;
    }
    $('lesson-code').hidden = !t; $('lcode').hidden = !t;
    if (!t) return;
    $('lcode-topic').textContent = t.title + (t.section ? ' · ' + t.section.title : '');
    $('lcode-view').innerHTML = '<div class="skel" style="height:280px"></div>';
    try {
      const item = await LLDCode.item(t.id);
      if (codeFor !== title) return;
      LLDView.mount($('lcode-view'), { item, height: '520px', bigTabs: true, run: false, state: { v: t.variant }, labels: { code: 'Code for this lesson', notes: 'Notes' } });
    } catch (e) { $('lcode-view').innerHTML = `<p class="note">Couldn't load the code from GitHub right now. <a href="${LLDCode.github(t.path)}" target="_blank" rel="noopener">View it on GitHub ↗</a></p>`; }
  }

  function render(autoplay = false) {
    if (!lessons.length) return;
    renderText();
    showVideo(lessons[idx - 1].youtube, autoplay);
    renderList();
    store.set('ytb:last:' + course.slug, lessons[idx - 1].youtube ? { v: lessons[idx - 1].youtube } : { l: idx });
  }

  function go(n, push, autoplay = false) {
    if (!lessons.length) return;
    closeQuiz();
    idx = clamp(n, 1, total);
    if (push) history.pushState(null, '', urlFor(idx));
    render(autoplay);
    window.scrollTo({ top: 0, behavior: 'smooth' });
  }

  const lastOfModule = (i) => lessons[i - 1] && (i === total || lessons[i].section !== lessons[i - 1].section);
  $('prev').addEventListener('click', () => go(idx - 1, true, true));
  $('next').addEventListener('click', () => {
    const qm = lastOfModule(idx) && quizFor(lessons[idx - 1].section);
    if (qm) return openQuiz(lessons[idx - 1].section, true);
    go(idx + 1, true, true);
  });
  $('mark').addEventListener('click', () => {
    const l = lessons[idx - 1];
    if (!l || !l.youtube) return;
    const nowDone = !done.has(l.youtube);
    nowDone ? done.add(l.youtube) : done.delete(l.youtube);
    YTB.progress.set(course, l.youtube, nowDone);
    renderText(); renderList();
  });
  window.addEventListener('popstate', () => {
    if (!lessons.length) return;
    const p = new URLSearchParams(location.search);
    const qm = p.get('quiz') && quizBySlug(p.get('quiz'));
    if (qm) return openQuiz(qm.section, false);
    closeQuiz();
    idx = idxFromUrl(p);
    render();
  });
  document.addEventListener('keydown', (e) => {
    if (e.target.closest('input,textarea')) return;
    if (e.key === 'ArrowRight' && e.shiftKey) go(idx + 1, true, true);
    if (e.key === 'ArrowLeft' && e.shiftKey) go(idx - 1, true, true);
  });

  if (playlistMode) {
    $('title').textContent = 'Loading lessons…';
    ['prev', 'next', 'mark'].forEach((b) => ($(b).disabled = true));
    $('on-yt').style.display = 'none';
  } else {
    idx = idxFromUrl(params);
    await loadQuizzes();
    const startQuiz = params.get('quiz') && quizBySlug(params.get('quiz'));
    if (startQuiz) { render(); openQuiz(startQuiz.section, false); }
    else { history.replaceState(null, '', urlFor(idx)); render(); }
  }
})();
</script>
</body>
</html>
