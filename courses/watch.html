<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<script src="../assets/theme.js"></script>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Course — YourTechBuddy</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="courses.css">
<style>
  .layout{display:grid;grid-template-columns:minmax(0,1fr) 360px;gap:0;flex:1;min-height:0}
  .stage{padding:24px clamp(16px,3vw,32px) 40px;min-width:0}
  .player-wrap{position:relative;aspect-ratio:16/9;background:#000;border-radius:4px;overflow:hidden;border:1.5px solid var(--text)}
  .player-wrap > div, .player-wrap iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
  .placeholder{position:absolute;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;gap:12px;text-align:center;padding:24px;background:var(--panel)}
  .placeholder.show{display:flex}
  .placeholder h3{margin:0;font-size:20px}
  .placeholder p{margin:0;color:var(--muted)}
  .crumb{font-size:13px;color:var(--muted);margin:18px 0 4px}
  .crumb a{color:var(--muted)}
  h1{font-size:clamp(20px,2.4vw,26px);margin:0 0 16px;letter-spacing:-.015em}
  .actions{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
  .actions .spacer{flex:1}

  aside{border-left:1px solid var(--border);background:var(--panel);display:flex;flex-direction:column;min-height:0;max-height:calc(100vh - 55px);position:sticky;top:55px}
  .aside-head{padding:18px 18px 14px;border-bottom:1px solid var(--border)}
  .aside-head h2{font-size:16px;margin:0 0 10px}
  .aside-head .meta{display:flex;justify-content:space-between;font-size:12px;color:var(--muted);margin-top:8px}
  .list{overflow:auto;flex:1;padding:6px 0 20px}
  .sec{padding:16px 18px 6px;font:600 13px var(--mono);color:var(--text)}
  .lesson{display:flex;gap:10px;align-items:flex-start;padding:9px 18px;text-decoration:none;font-size:14px;border-left:3px solid transparent}
  .lesson:hover{background:var(--panel2)}
  .lesson.current{background:var(--panel2);border-left-color:var(--accent)}
  .lesson .n{flex:none;width:22px;height:22px;border-radius:50%;display:grid;place-items:center;font:600 11px var(--mono);border:1px solid var(--border);color:var(--muted);margin-top:1px}
  .lesson.done .n{background:var(--ok);border-color:var(--ok);color:var(--on-accent)}
  .lesson .t{flex:1;min-width:0}
  .lesson .d{font-size:12px;color:var(--muted)}
  .lesson.locked{color:var(--muted)}

  @media (max-width:980px){
    .layout{grid-template-columns:1fr}
    aside{border-left:0;border-top:1px solid var(--border);position:static;max-height:none}
  }
</style>
</head>
<body>
<header>
  <a class="brand" href="../"><div class="logo">YTB</div><b>yourtechbuddy</b></a>
  <nav>
    <a href="../playground/">playground</a>
    <a href="./" class="active">courses</a>
    <a href="../practice/">practice</a>
    <a class="yt" href="https://www.youtube.com/@yourtechbuddy101" target="_blank" rel="noopener">youtube</a>
  </nav>
  <div id="auth"></div>
</header>

<div class="layout">
  <main class="stage">
    <div class="player-wrap">
      <div id="player"></div>
      <div class="placeholder" id="placeholder">
        <h3>🎬 Coming soon</h3>
        <p>This lesson hasn't been published yet. Subscribe so you don't miss it.</p>
        <a class="btn primary" href="https://www.youtube.com/@yourtechbuddy101?sub_confirmation=1" target="_blank" rel="noopener">Subscribe on YouTube</a>
      </div>
    </div>

    <div class="crumb"><a href="./">Courses</a> / <span id="crumb-course"></span> / <span id="crumb-sec"></span></div>
    <h1 id="title">Loading…</h1>

    <div class="actions">
      <button class="btn" id="prev">← Previous</button>
      <button class="btn" id="mark">✓ Mark complete</button>
      <button class="btn primary" id="next">Next →</button>
      <span class="spacer"></span>
      <a class="btn" href="../practice/">Mock interview</a>
      <a class="btn" id="practice" href="../playground/">⌨️ Practise in Playground</a>
      <a class="btn" id="on-yt" target="_blank" rel="noopener">Watch on YouTube ↗</a>
    </div>
  </main>

  <aside>
    <div class="aside-head">
      <h2 id="course-title"></h2>
      <div class="progress"><i id="bar" style="width:0%"></i></div>
      <div class="meta"><span id="done-count"></span><span id="pct"></span></div>
    </div>
    <div class="list" id="list"></div>
  </aside>
</div>

<script src="../assets/config.js"></script>
<script src="courses.js"></script>
<script src="../assets/ytb.js"></script>
<script>
  const $ = (id) => document.getElementById(id);
  const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
  const store = {
    get(k, d) { try { const v = JSON.parse(localStorage.getItem(k)); return v ?? d; } catch { return d; } },
    set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} },
  };
  const clamp = (n, a, b) => Math.max(a, Math.min(b, n));

(async () => {
  const params = new URLSearchParams(location.search);
  const course = (await YTB.getCourse(params.get('c'))) || (await YTB.getCourses())[0];
  if (!course) { $('title').textContent = 'Course not found.'; return; }
  const titles = store.get('ytb:titles', {});
  let done = await YTB.progress.load(course);
  let lessons = [], total = 0, liveCount = 0, idx = 1, playlistIds = [];

  function setLessons(list) {
    lessons = list; total = list.length; liveCount = list.filter((l) => l.youtube).length;
    store.set('ytb:count:' + course.slug, liveCount);
  }
  const urlFor = (n) => { const l = lessons[n - 1]; return `?c=${course.slug}&` + (l && l.youtube ? `v=${l.youtube}` : `l=${n}`); };
  function idxFromUrl(p) {
    const v = p.get('v');
    if (v) { const i = lessons.findIndex((l) => l.youtube === v); if (i >= 0) return i + 1; }
    return clamp(parseInt(p.get('l'), 10) || firstUnfinished(), 1, total);
  }
  // Groups playlist videos into sections by keywords in their titles (see `groups` in courses.js).
  function buildPlaylistLessons() {
    const cur = lessons[idx - 1] && lessons[idx - 1].youtube;
    const allKnown = playlistIds.every((id) => titles[id]);
    let list;
    if (course.groups && allKnown) {
      const buckets = course.groups.map((g) => ({ title: g.title, items: [] }));
      const more = { title: course.fallbackGroup || 'More lessons', items: [] };
      const order = course.groupPriority || course.groups.map((_, i) => i);
      playlistIds.forEach((id) => {
        const t = titles[id].toLowerCase();
        const gi = order.find((i) => course.groups[i].match.some((k) => t.includes(k)));
        (gi !== undefined ? buckets[gi] : more).items.push(id);
      });
      list = [...buckets, more].filter((b) => b.items.length)
        .flatMap((b) => b.items.map((id) => ({ title: titles[id], youtube: id, section: b.title })));
    } else {
      list = playlistIds.map((id, i) => ({ title: titles[id] || `Lesson ${i + 1}`, youtube: id, section: course.title }));
    }
    setLessons(list);
    if (cur) idx = (lessons.findIndex((l) => l.youtube === cur) + 1) || 1;
  }
  function firstUnfinished() {
    const i = lessons.findIndex((l) => l.youtube && !done.has(l.youtube));
    return i >= 0 ? i + 1 : 1;
  }

  // Playlist mode: lessons come live from the YouTube playlist (new uploads appear automatically).
  const playlistMode = !!course.playlist && !(course.sections || []).some((s) => s.lessons.length);
  if (!playlistMode) {
    setLessons(course.sections.flatMap((s) => s.lessons.map((l) => ({ ...l, section: s.title }))));
  }

  document.title = `${course.title} — YourTechBuddy`;
  $('course-title').textContent = course.title;
  $('crumb-course').textContent = course.title;

  /* ---------- Sidebar ---------- */
  function renderList() {
    let html = '', lastSec = null;
    lessons.forEach((l, i) => {
      const n = i + 1;
      if (l.section !== lastSec) { html += `<div class="sec">${esc(l.section)}</div>`; lastSec = l.section; }
      const isDone = l.youtube && done.has(l.youtube);
      const cls = ['lesson', n === idx ? 'current' : '', isDone ? 'done' : '', l.youtube ? '' : 'locked'].join(' ');
      html += `<a class="${cls}" href="${urlFor(n)}" data-l="${n}">
        <span class="n">${isDone ? '✓' : n}</span>
        <span class="t">${esc(l.title)}${l.duration ? `<div class="d">${esc(l.duration)}</div>` : ''}</span>
        ${l.youtube ? '' : '<span class="soon">soon</span>'}
      </a>`;
    });
    $('list').innerHTML = html;
    const count = lessons.filter((l) => l.youtube && done.has(l.youtube)).length;
    const pct = liveCount ? Math.round((count / liveCount) * 100) : 0;
    $('bar').style.width = pct + '%';
    $('done-count').textContent = `${count} / ${liveCount} completed`;
    $('pct').textContent = pct + '%';
    const cur = $('list').querySelector('.current');
    if (cur) cur.scrollIntoView({ block: 'nearest' });
  }
  $('list').addEventListener('click', (e) => {
    const a = e.target.closest('a[data-l]');
    if (!a) return;
    e.preventDefault();
    go(parseInt(a.dataset.l, 10), true, true);
  });

  /* ---------- Player (YouTube IFrame API, privacy-enhanced domain) ---------- */
  let player = null, playerReady = false, pendingId = null;
  window.onYouTubeIframeAPIReady = () => {
    const vars = { rel: 0, modestbranding: 1, playsinline: 1 };
    if (playlistMode) { vars.listType = 'playlist'; vars.list = course.playlist; }
    const opts = {
      host: 'https://www.youtube-nocookie.com',
      playerVars: vars,
      events: {
        onReady: () => {
          playerReady = true;
          if (playlistMode) waitForPlaylist();
          else if (pendingId) { player.cueVideoById(pendingId); pendingId = null; }
        },
        onError: (e) => { if (playlistMode && !lessons.length) playlistFailed(`YouTube error ${e.data}`); },
        onStateChange: (e) => {
          if (e.data === YT.PlayerState.PLAYING) cacheCurrentTitle();
          if (e.data === YT.PlayerState.ENDED) onEnded();
        },
      },
    };
    // Only pass videoId when we actually have one (YouTube rejects an empty/undefined id).
    if (!playlistMode && pendingId) { opts.videoId = pendingId; pendingId = null; }
    if (playlistMode && !/^(PL|UU|OL|FL|RD|LL)[A-Za-z0-9_-]{10,}$/.test(course.playlist)) {
      playlistFailed('invalid playlist id'); return;
    }
    try { player = new YT.Player('player', opts); }
    catch (err) { console.warn('[YTB] player error:', err); if (playlistMode) playlistFailed(String(err)); }
  };
  const s = document.createElement('script');
  s.src = 'https://www.youtube.com/iframe_api';
  document.head.appendChild(s);

  function waitForPlaylist(tries = 0) {
    const ids = player.getPlaylist && player.getPlaylist();
    if (ids && ids.length) {
      playlistIds = ids;
      buildPlaylistLessons();
      idx = idxFromUrl(params);
      history.replaceState(null, '', urlFor(idx));
      render();
      fetchTitles(ids);
      return;
    }
    if (tries > 40) { playlistFailed('timed out'); return; }
    setTimeout(() => waitForPlaylist(tries + 1), 250);
  }

  let failed = false;
  function playlistFailed(reason) {
    if (failed || lessons.length) return;
    failed = true;
    console.warn('[YTB] playlist load failed:', reason, course.playlist);
    $('title').textContent = "Couldn't load this course's playlist.";
    $('crumb-sec').textContent = `Check the playlist ID in courses.js (${course.playlist.length} chars — full IDs are usually 34)`;
    $('on-yt').style.display = ''; $('on-yt').textContent = 'Open playlist on YouTube ↗';
    $('on-yt').href = `https://www.youtube.com/playlist?list=${encodeURIComponent(course.playlist)}`;
  }
  // Safety net: if the YouTube API never even becomes ready (blocked, offline), don't spin forever.
  if (playlistMode) setTimeout(() => playlistFailed('player never became ready'), 15000);

  function cacheCurrentTitle() {
    const d = player.getVideoData && player.getVideoData();
    if (d && d.video_id && d.title && titles[d.video_id] !== d.title) {
      titles[d.video_id] = d.title; store.set('ytb:titles', titles); applyTitles();
    }
  }
  async function fetchTitles(ids) {
    const missing = ids.filter((id) => !titles[id]);
    for (let i = 0; i < missing.length; i += 6) {
      await Promise.all(missing.slice(i, i + 6).map(async (id) => {
        try {
          const r = await fetch('https://noembed.com/embed?url=' + encodeURIComponent('https://www.youtube.com/watch?v=' + id));
          const j = await r.json();
          if (j && j.title) titles[id] = j.title;
        } catch {}
      }));
      store.set('ytb:titles', titles);
      applyTitles();
    }
  }
  function applyTitles() {
    if (playlistMode) { buildPlaylistLessons(); history.replaceState(null, '', urlFor(idx)); }
    else lessons.forEach((l) => { if (l.youtube && titles[l.youtube]) l.title = titles[l.youtube]; });
    renderText(); renderList();
  }

  function showVideo(id, autoplay) {
    $('placeholder').classList.toggle('show', !id);
    if (!id) { if (player && player.pauseVideo) player.pauseVideo(); return; }
    if (!playerReady) { pendingId = id; return; }
    autoplay ? player.loadVideoById(id) : player.cueVideoById(id);
  }

  function onEnded() {
    const l = lessons[idx - 1];
    if (l && l.youtube && !done.has(l.youtube)) { done.add(l.youtube); YTB.progress.set(course, l.youtube, true); }
    const nextLive = lessons.findIndex((x, i) => i >= idx && x.youtube);
    if (nextLive >= 0) go(nextLive + 1, true, true); else { renderText(); renderList(); }
  }

  /* ---------- Lesson rendering ---------- */
  function renderText() {
    const l = lessons[idx - 1];
    if (!l) return;
    $('title').textContent = `${idx}. ${l.title}`;
    $('crumb-sec').textContent = l.section;
    $('prev').disabled = idx <= 1;
    $('next').disabled = idx >= total;
    const isDone = l.youtube && done.has(l.youtube);
    $('mark').disabled = !l.youtube;
    $('mark').textContent = isDone ? '✓ Completed' : '✓ Mark complete';
    $('mark').classList.toggle('done', !!isDone);
    $('on-yt').style.display = l.youtube ? '' : 'none';
    if (l.youtube) $('on-yt').href = `https://www.youtube.com/watch?v=${encodeURIComponent(l.youtube)}` + (course.playlist ? `&list=${course.playlist}` : '');
    const lang = l.practice || course.practice;
    $('practice').href = lang ? `../playground/#lang=${encodeURIComponent(lang)}` : '../playground/';
  }
  function render(autoplay = false) {
    if (!lessons.length) return;
    renderText();
    showVideo(lessons[idx - 1].youtube, autoplay);
    renderList();
    store.set('ytb:last:' + course.slug, lessons[idx - 1].youtube ? { v: lessons[idx - 1].youtube } : { l: idx });
  }

  function go(n, push, autoplay = false) {
    if (!lessons.length) return;
    idx = clamp(n, 1, total);
    if (push) history.pushState(null, '', urlFor(idx));
    render(autoplay);
    window.scrollTo({ top: 0, behavior: 'smooth' });
  }

  $('prev').addEventListener('click', () => go(idx - 1, true, true));
  $('next').addEventListener('click', () => go(idx + 1, true, true));
  $('mark').addEventListener('click', () => {
    const l = lessons[idx - 1];
    if (!l || !l.youtube) return;
    const nowDone = !done.has(l.youtube);
    nowDone ? done.add(l.youtube) : done.delete(l.youtube);
    YTB.progress.set(course, l.youtube, nowDone);
    renderText(); renderList();
  });
  window.addEventListener('popstate', () => {
    if (!lessons.length) return;
    idx = idxFromUrl(new URLSearchParams(location.search));
    render();
  });
  document.addEventListener('keydown', (e) => {
    if (e.target.closest('input,textarea')) return;
    if (e.key === 'ArrowRight' && e.shiftKey) go(idx + 1, true, true);
    if (e.key === 'ArrowLeft' && e.shiftKey) go(idx - 1, true, true);
  });

  if (playlistMode) {
    $('title').textContent = 'Loading lessons…';
    ['prev', 'next', 'mark'].forEach((b) => ($(b).disabled = true));
    $('on-yt').style.display = 'none';
  } else {
    idx = idxFromUrl(params);
    history.replaceState(null, '', urlFor(idx));
    render();
  }
})();
</script>
</body>
</html>
