<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<script src="../assets/theme.js"></script>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Courses — YourTechBuddy</title>
<meta name="description" content="Free, structured video courses by YourTechBuddy: Low Level Design, design patterns and more. Watch here and practice in the browser.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="courses.css">
<style>
  .cgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:20px}
  .ccard .body{padding:16px 18px 18px;display:flex;flex-direction:column;gap:6px;flex:1}
  .ccard h3{margin:0;font:600 17px/1.35 var(--sans)}
  .ccard p{margin:0;color:var(--muted);font-size:14px;line-height:1.5}
  .ccard .tags{display:flex;gap:6px;flex-wrap:wrap;margin-top:4px}
  .ccard .meta{display:flex;align-items:center;gap:12px;margin-top:auto;padding-top:14px}
  .ccard .meta .progress{flex:1}
  .ccard .meta small{color:var(--muted);font-size:13px;white-space:nowrap}
  .ccard .btn{pointer-events:none}
  a.ccard:hover .btn{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
  .draft{color:var(--warn)}
</style>
</head>
<body>
<header>
  <a class="brand" href="../"><div class="logo">YTB</div><b>yourtechbuddy</b></a>
  <nav>
    <a href="../playground/">playground</a>
    <a href="./" class="active">courses</a>
    <a href="../practice/">practice</a>
    <a class="yt" href="https://www.youtube.com/@yourtechbuddy101" target="_blank" rel="noopener">youtube</a>
  </nav>
  <div id="auth"></div>
</header>

<main class="page">
  <div class="ph"><div><h1>Courses</h1><p>Free video courses in Hindi. Watch here, tick off lessons as you go, and practise in the playground or a mock interview.</p></div></div>
  <div class="cgrid" id="grid"></div>
</main>

<footer>Made by <a href="https://www.youtube.com/@yourtechbuddy101" target="_blank" rel="noopener">YourTechBuddy</a></footer>

<script src="../assets/config.js"></script>
<script src="courses.js"></script>
<script src="../assets/ytb.js"></script>
<script>
  const esc = YTB.esc, read = (k) => YTB.LS.get(k, null);
  const grid = document.getElementById('grid');

  (async () => {
    grid.innerHTML = '<p style="color:var(--muted)">Loading courses…</p>';
    const courses = await YTB.getCourses();
    const prog = await YTB.progress.loadAll(courses);
    grid.innerHTML = courses.length ? '' : '<p style="color:var(--muted)">No courses yet — check back soon.</p>';

    for (const c of courses) {
      const lessons = (c.sections || []).flatMap((s) => s.lessons);
      const live = lessons.filter((l) => l.youtube);
      const isPlaylist = !!c.playlist && !lessons.length;
      const liveCount = isPlaylist ? (read('ytb:count:' + c.slug) || 0) : live.length;
      const doneSet = prog[c.slug] || new Set();
      const done = isPlaylist ? doneSet.size : live.filter((l) => doneSet.has(l.youtube)).length;
      const pct = liveCount ? Math.min(100, Math.round((done / liveCount) * 100)) : 0;
      const last = read('ytb:last:' + c.slug);
      const lastQ = last && typeof last === 'object' ? (last.v ? '&v=' + encodeURIComponent(last.v) : '&l=' + last.l) : '';
      const groups = (c.sections || []).filter((s) => s.lessons.some((l) => l.youtube)).length;
      const cover = (last && last.v) || live[0]?.youtube;
      const a = document.createElement('a');
      a.className = 'card ccard';
      a.href = `watch.html?c=${encodeURIComponent(c.slug)}${lastQ}`;
      a.innerHTML = `
        <div class="thumb">${cover ? `<img src="${YTB.thumb(cover)}" alt="" loading="lazy" onerror="this.remove()">` : ''}<span class="play"><i></i></span>
          <span class="dur">${liveCount ? liveCount + ' lessons' : 'coming soon'}</span>${pct ? `<span class="bar"><i style="width:${pct}%"></i></span>` : ''}</div>
        <div class="body">
          <h3>${esc(c.title)}</h3>${c.tagline ? `<p>${esc(c.tagline)}</p>` : ''}
          <div class="tags">${c.level ? `<span class="tag">${esc(c.level)}</span>` : ''}${groups > 1 ? `<span class="tag">${groups} sections</span>` : ''}${c.published === false ? '<span class="tag draft">draft</span>' : ''}</div>
          <div class="meta"><span class="progress" title="${pct}% complete"><i style="width:${pct}%"></i></span><small>${done ? `${done}/${liveCount}` : ''}</small><span class="btn sm">${done ? 'Continue' : 'Start'}</span></div>
        </div>`;
      grid.appendChild(a);
    }
  })();
</script>
</body>
</html>
