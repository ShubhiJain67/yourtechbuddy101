<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<script src="../assets/theme.js"></script>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Courses — YourTechBuddy</title>
<meta name="description" content="Free, structured video courses by YourTechBuddy: Low Level Design, design patterns and more. Watch here and practice in the browser.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="courses.css">
<style>
  .hero{width:100%;max-width:1120px;margin:0 auto;padding:52px 24px 28px}
  .hero h1{font:700 clamp(30px,4vw,44px)/1.1 var(--sans);margin:0 0 10px;letter-spacing:-.03em}
  .hero p{color:var(--muted);margin:0;font-size:17px;max-width:56ch}
  .grid{width:100%;max-width:1120px;margin:0 auto;padding:8px 24px 56px;display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:24px;align-items:start}
  .uml .attrs .draft{color:var(--warn)}
  .uml .ops{display:flex;align-items:center;gap:12px}
  .uml .ops .progress{flex:1}
  .uml .ops .pct{color:var(--muted);font-size:12.5px}
  .empty{color:var(--muted)}
  @media (max-width:600px){ .grid{grid-template-columns:1fr;padding:8px 16px 40px} .hero{padding:32px 16px 16px} }
</style>
</head>
<body>
<header>
  <a class="brand" href="../"><div class="logo">YTB</div><b>yourtechbuddy</b></a>
  <nav>
    <a href="../playground/">playground</a>
    <a href="./" class="active">courses</a>
    <a class="yt" href="https://www.youtube.com/@yourtechbuddy101" target="_blank" rel="noopener">youtube</a>
  </nav>
  <div id="auth"></div>
</header>

<section class="hero">
  <h1>Courses</h1>
  <p>Free, structured video courses. Watch them here, track your progress, and practise in the Playground.</p>
</section>

<section class="grid" id="grid"></section>

<footer>Made by <a href="https://www.youtube.com/@yourtechbuddy101" target="_blank" rel="noopener">YourTechBuddy</a></footer>

<script src="../assets/config.js"></script>
<script src="courses.js"></script>
<script src="../assets/ytb.js"></script>
<script>
  const esc = YTB.esc, read = (k) => YTB.LS.get(k, null);
  const grid = document.getElementById('grid');

  (async () => {
    grid.innerHTML = '<p style="color:var(--muted)">Loading courses…</p>';
    const courses = await YTB.getCourses();
    const prog = await YTB.progress.loadAll(courses);
    grid.innerHTML = courses.length ? '' : '<p style="color:var(--muted)">No courses yet — check back soon.</p>';

    for (const c of courses) {
      const lessons = (c.sections || []).flatMap((s) => s.lessons);
      const live = lessons.filter((l) => l.youtube);
      const isPlaylist = !!c.playlist && !lessons.length;
      const liveCount = isPlaylist ? (read('ytb:count:' + c.slug) || 0) : live.length;
      const doneSet = prog[c.slug] || new Set();
      const done = isPlaylist ? doneSet.size : live.filter((l) => doneSet.has(l.youtube)).length;
      const pct = liveCount ? Math.min(100, Math.round((done / liveCount) * 100)) : 0;
      const last = read('ytb:last:' + c.slug);
      const lastQ = last && typeof last === 'object' ? (last.v ? '&v=' + encodeURIComponent(last.v) : '&l=' + last.l) : '';
      const groups = (c.sections || []).filter((s) => s.lessons.some((l) => l.youtube)).length;
      const a = document.createElement('a');
      a.className = 'uml';
      a.href = `watch.html?c=${encodeURIComponent(c.slug)}${lastQ}`;
      a.innerHTML = `
        <div class="name"><span class="stereo">«course»</span><b>${esc(c.title)}</b>${c.tagline ? `<small>${esc(c.tagline)}</small>` : ''}</div>
        <div class="attrs">
          + lessons <span>= ${liveCount || '—'}</span><br>
          ${groups > 1 ? `+ groups <span>= ${groups}</span><br>` : ''}
          ${c.level ? `+ level <span>= "${esc(c.level)}"</span><br>` : ''}
          ${c.published === false ? '<span class="draft">+ draft = true</span>' : ''}
        </div>
        <div class="ops">
          <span class="call">+ ${done ? 'continue' : 'start'}()</span>
          <div class="progress" title="${pct}% complete"><i style="width:${pct}%"></i></div>
          <span class="pct">${pct}%</span>
        </div>`;
      grid.appendChild(a);
    }
  })();
</script>
</body>
</html>
