  #fallback{flex:1;width:100%;resize:none;border:0;outline:0;padding:14px;background:var(--bg);font:14px/1.6 var(--mono);tab-size:4;display:none}

<!-- ============ Worker sources (kept as text, launched as Blob workers) ============ -->
<script type="text/js-worker" id="js-worker-src">
self.onmessage = async (e) => {
  const { code, stdin } = e.data;
  const lines = stdin.length ? stdin.split('\n') : [];
  let i = 0;
  self.readline = () => (i < lines.length ? lines[i++] : null);
  self.prompt = self.readline;

  const fmt = (args) => args.map((x) => {
    if (typeof x === 'string') return x;
    if (x === undefined) return 'undefined';
    if (typeof x === 'function') return x.toString();
    if (x instanceof Error) return x.stack || String(x);
    try { return JSON.stringify(x, null, 2); } catch { return String(x); }
  }).join(' ');
  const send = (stream) => (...args) => postMessage({ type: 'out', stream, text: fmt(args) + '\n' });
  console.log = console.info = console.debug = send('stdout');
  console.error = console.warn = send('stderr');
  console.table = (d) => send('stdout')(d);

  try {
    const AsyncFunction = Object.getPrototypeOf(async function () {}).constructor;
    await new AsyncFunction(code)();
    // give pending timers/promises a moment to flush their logs
    await new Promise((r) => setTimeout(r, 50));
    postMessage({ type: 'done', ok: true });
  } catch (err) {
    postMessage({ type: 'out', stream: 'stderr', text: (err && err.stack ? err.stack : String(err)) + '\n' });
    postMessage({ type: 'done', ok: false });
  }
};
</script>

<script type="text/js-worker" id="py-worker-src">
importScripts('https://cdn.jsdelivr.net/pyodide/v0.26.4/full/pyodide.js');
const ready = loadPyodide().then((py) => { postMessage({ type: 'loaded', version: py.runPython('import sys; sys.version.split()[0]') }); return py; });
ready.catch((err) => postMessage({ type: 'fatal', text: 'Could not load Python runtime: ' + err }));

self.onmessage = async (e) => {
  const { code, stdin } = e.data;
  let py;
  try { py = await ready; } catch { return; }
  postMessage({ type: 'started' });
  try {
    py.setStdout({ batched: (s) => postMessage({ type: 'out', stream: 'stdout', text: s + '\n' }) });
    py.setStderr({ batched: (s) => postMessage({ type: 'out', stream: 'stderr', text: s + '\n' }) });
    py.globals.set('__ytb_stdin', stdin);
    py.runPython('import sys, io\nsys.stdin = io.StringIO(__ytb_stdin)');
    await py.loadPackagesFromImports(code);
    const ns = py.globals.get('dict')();          // fresh namespace each run
    ns.set('__name__', '__main__');
    await py.runPythonAsync(code, { globals: ns });
    ns.destroy();
    postMessage({ type: 'done', ok: true });
  } catch (err) {
    // trim Pyodide-internal frames from the traceback
    let msg = String(err && err.message ? err.message : err);
    const idx = msg.indexOf('File "<exec>"');
    if (idx > 0) msg = 'Traceback (most recent call last):\n  ' + msg.slice(idx);
    postMessage({ type: 'out', stream: 'stderr', text: msg.trimEnd() + '\n' });
    postMessage({ type: 'done', ok: false });
  }
};
</script>

<script>
/* ===================== Languages ===================== */
const LANGS = {
  javascript: {
    label: 'JavaScript', monaco: 'javascript', file: 'main.js', runner: 'js',

  c: {

  java: {

`// Welcome to YourTechBuddy Playground 👋

/* ===================== Helpers ===================== */
const $ = (id) => document.getElementById(id);
const store = {
  get(k) { try { return localStorage.getItem('ytb:' + k); } catch { return null; } },
  set(k, v) { try { localStorage.setItem('ytb:' + k, v); } catch {} },
  del(k) { try { localStorage.removeItem('ytb:' + k); } catch {} },
};
function toast(msg) {
  const t = $('toast'); t.textContent = msg; t.classList.add('show');
  clearTimeout(toast._t); toast._t = setTimeout(() => t.classList.remove('show'), 2200);
}
function b64encode(str) {
  const bytes = new TextEncoder().encode(str); let bin = '';
  for (let i = 0; i < bytes.length; i += 0x8000) bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
  return btoa(bin).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
}
function b64decode(s) {
  s = s.replace(/-/g, '+').replace(/_/g, '/'); while (s.length % 4) s += '=';
  const bin = atob(s); const bytes = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
  return new TextDecoder().decode(bytes);
}

/* ===================== Output ===================== */
const out = $('output');
function clearOutput() { out.innerHTML = ''; }
function write(text, cls) {
  if (!text) return;
  const ph = out.querySelector('.placeholder'); if (ph) ph.remove();
  const span = document.createElement('span');
  if (cls && cls !== 'stdout') span.className = cls;
  span.textContent = text;
  out.appendChild(span);
  out.scrollTop = out.scrollHeight;
}
function setStatus(text, kind) { const s = $('status'); s.textContent = text; s.className = 'pill' + (kind ? ' ' + kind : ''); }

/* ===================== Editor (Monaco with textarea fallback) ===================== */
const MONACO = 'https://cdn.jsdelivr.net/npm/monaco-editor@0.52.0/min';
let monacoEditor = null;
const fallback = $('fallback');
const editor = {
  get() { return monacoEditor ? monacoEditor.getValue() : fallback.value; },
  set(v) { if (monacoEditor) monacoEditor.setValue(v); else fallback.value = v; },
  lang(l) { if (monacoEditor) monaco.editor.setModelLanguage(monacoEditor.getModel(), l); },
  focus() { (monacoEditor || fallback).focus(); },
};

function useFallback() {
  $('editor').style.display = 'none'; fallback.style.display = 'block';
  fallback.value = initialCode();
  fallback.addEventListener('input', saveCodeSoon);
  fallback.addEventListener('keydown', (e) => {
    if ((e.ctrlKey || e.metaKey) && e.key === 'Enter') { e.preventDefault(); run(); }
    if (e.key === 'Tab') { e.preventDefault(); document.execCommand('insertText', false, '    '); }
  });
}

function loadMonaco() {
  window.MonacoEnvironment = {
    getWorkerUrl: () => 'data:text/javascript;charset=utf-8,' + encodeURIComponent(
      `self.MonacoEnvironment={baseUrl:'${MONACO}/'};importScripts('${MONACO}/vs/base/worker/workerMain.js');`)
  };
  const s = document.createElement('script');
  s.src = MONACO + '/vs/loader.js';
  s.onerror = useFallback;
  s.onload = () => {
    require.config({ paths: { vs: MONACO + '/vs' } });
    require(['vs/editor/editor.main'], () => {
      monaco.editor.defineTheme('ytb', {
        base: 'vs-dark', inherit: true, rules: [],
        colors: { 'editor.background': '#0b0e14', 'editorLineNumber.foreground': '#3b4556', 'editor.lineHighlightBackground': '#11151d' }
      });
      monacoEditor = monaco.editor.create($('editor'), {
        value: initialCode(), language: LANGS[currentLang].monaco, theme: 'ytb',
        fontFamily: "'JetBrains Mono', Menlo, monospace", fontSize: 14, fontLigatures: true,
        minimap: { enabled: false }, automaticLayout: true, scrollBeyondLastLine: false,
        padding: { top: 12 }, tabSize: 4, smoothScrolling: true, cursorBlinking: 'smooth',
      });
      monacoEditor.addCommand(monaco.KeyMod.CtrlCmd | monaco.KeyCode.Enter, run);
      monacoEditor.onDidChangeModelContent(saveCodeSoon);
      monacoEditor.focus();
    }, useFallback);
  };
  document.head.appendChild(s);
}

/* ===================== State ===================== */
let currentLang = 'javascript';
let sharedCode = null;

(function readInitialState() {
  const h = new URLSearchParams(location.hash.slice(1));
  if (h.get('lang') && LANGS[h.get('lang')]) currentLang = h.get('lang');
  else if (LANGS[store.get('lang')]) currentLang = store.get('lang');
  if (h.get('code')) { try { sharedCode = b64decode(h.get('code')); } catch {} }
  if (h.get('stdin')) { try { $('stdin').value = b64decode(h.get('stdin')); } catch {} }
  else $('stdin').value = store.get('stdin') ?? 'YourTechBuddy';
})();

function initialCode() {
  if (sharedCode != null) { const c = sharedCode; sharedCode = null; return c; }
  return store.get('code:' + currentLang) ?? LANGS[currentLang].starter;
}
let saveTimer;
function saveCodeSoon() { clearTimeout(saveTimer); saveTimer = setTimeout(() => store.set('code:' + currentLang, editor.get()), 300); }

const sel = $('lang');
for (const [id, l] of Object.entries(LANGS)) sel.add(new Option(l.label, id));
sel.value = currentLang;

function updateLangUI() {
  const l = LANGS[currentLang];
  $('filename').textContent = l.file;
  $('runtime-info').textContent =
    l.runner === 'js' ? 'Runs in your browser' :
    l.runner === 'py' ? (pyVersion ? `Python ${pyVersion} · in browser` : 'Python · in browser') :
    (l.compiler ? l.compiler.display : 'Compiled on Wandbox');
  if (l.runner === 'py') warmPython();
  if (l.runner === 'wandbox') pickCompiler(l).then(updateLangUI).catch(() => {});
}

sel.addEventListener('change', () => {
  store.set('code:' + currentLang, editor.get());
  currentLang = sel.value; store.set('lang', currentLang);
  history.replaceState(null, '', location.pathname + location.search);
  editor.set(store.get('code:' + currentLang) ?? LANGS[currentLang].starter);
  editor.lang(LANGS[currentLang].monaco);
  updateLangUI(); editor.focus();
});
$('stdin').addEventListener('input', () => store.set('stdin', $('stdin').value));
$('stdin').addEventListener('keydown', (e) => { if ((e.ctrlKey || e.metaKey) && e.key === 'Enter') { e.preventDefault(); run(); } });
$('clear').addEventListener('click', () => { clearOutput(); setStatus('Idle'); });
$('reset').addEventListener('click', () => {
  if (!confirmReset()) return;
  store.del('code:' + currentLang); editor.set(LANGS[currentLang].starter); toast('Reset to starter code');
});
function confirmReset() {
  // two-click confirm instead of a blocking dialog
  const b = $('reset');
  if (b.dataset.armed) { delete b.dataset.armed; b.textContent = '↺ Reset'; return true; }
  b.dataset.armed = '1'; b.textContent = 'Click again'; setTimeout(() => { delete b.dataset.armed; b.textContent = '↺ Reset'; }, 2500);
  return false;
}
$('share').addEventListener('click', async () => {
  const params = new URLSearchParams({ lang: currentLang, code: b64encode(editor.get()) });
  if ($('stdin').value) params.set('stdin', b64encode($('stdin').value));
  const url = location.origin + location.pathname + '#' + params.toString();
  history.replaceState(null, '', url);
  try { await navigator.clipboard.writeText(url); toast('Link copied — share it anywhere!'); }
  catch { toast('Link is in your address bar'); }
});
$('run').addEventListener('click', run);

/* ===================== Runners ===================== */
const workerFromScript = (id) => new Worker(URL.createObjectURL(new Blob([$(id).textContent], { type: 'text/javascript' })));
const TIMEOUT_MS = 10000;
let running = false;

function runJS(code, stdin) {
  return new Promise((resolve) => {
    const w = workerFromScript('js-worker-src');
    const timer = setTimeout(() => { w.terminate(); write(`\n⏱ Stopped: took longer than ${TIMEOUT_MS / 1000}s (infinite loop?)\n`, 'stderr'); resolve(false); }, TIMEOUT_MS);
    w.onmessage = ({ data }) => {
      if (data.type === 'out') write(data.text, data.stream);
      if (data.type === 'done') { clearTimeout(timer); w.terminate(); resolve(data.ok); }
    };
    w.onerror = (e) => { clearTimeout(timer); w.terminate(); write(String(e.message) + '\n', 'stderr'); resolve(false); };
    w.postMessage({ code, stdin });
  });
}

let pyWorker = null, pyVersion = null, pyHandler = null;
function warmPython() {
  if (pyWorker) return pyWorker;
  pyWorker = workerFromScript('py-worker-src');
  pyWorker.onmessage = ({ data }) => {
    if (data.type === 'loaded') { pyVersion = data.version; if (LANGS[currentLang].runner === 'py') updateLangUI(); }
    if (data.type === 'fatal') { write(data.text + '\n', 'stderr'); pyWorker = null; }
    if (pyHandler) pyHandler(data);
  };
  return pyWorker;
}
function runPython(code, stdin) {
  return new Promise((resolve) => {
    const w = warmPython();
    if (!pyVersion) { setStatus('Loading Python…', 'run'); write('Loading Python runtime (first run only, ~5s)…\n', 'meta'); }
    let timer;
    pyHandler = (data) => {
      if (data.type === 'started') {
        if (!pyVersion) {} setStatus('Running…', 'run');
        timer = setTimeout(() => {
          w.terminate(); pyWorker = null; pyVersion = null; pyHandler = null;
          write(`\n⏱ Stopped: took longer than ${TIMEOUT_MS / 1000}s (infinite loop?)\n`, 'stderr'); resolve(false);
        }, TIMEOUT_MS);
      }
      if (data.type === 'out') write(data.text, data.stream);
      if (data.type === 'fatal') { pyHandler = null; resolve(false); }
      if (data.type === 'done') { clearTimeout(timer); pyHandler = null; resolve(data.ok); }
    };
    w.postMessage({ code, stdin });
  });
}

/* ---- Wandbox (compiled languages): called directly from the browser. ---- */
const WANDBOX = 'https://wandbox.org/api';
let compilersPromise = null;
function getCompilers() {
  return compilersPromise ??= (async () => {
    const r = await fetch(`${WANDBOX}/list.json`);
    if (!r.ok) throw new Error('Wandbox returned ' + r.status);
    return await r.json();
  })().catch((e) => { compilersPromise = null; throw e; });
}
async function pickCompiler(l) {
  if (l.compiler) return l.compiler;
  const list = await getCompilers();
  const all = list.filter((c) => c.language === l.wandbox);
  const stable = all.filter((c) => !/head|dev|nightly|snapshot/i.test(c.name + ' ' + c.version));
  const pool = (stable.length ? stable : all).sort((a, b) => String(b.version).localeCompare(String(a.version), undefined, { numeric: true }));
  let c = pool[0];
  if (l.wandbox === 'C++' || l.wandbox === 'C') c = pool.find((x) => x.name.startsWith('gcc')) || c;
  if (!c) throw new Error(`No ${l.label} compiler available right now`);
  l.compiler = { name: c.name, display: `${c['display-name'] || c.name} ${c.version}`.trim() };
  return l.compiler;
}
async function runWandbox(l, code, stdin) {
  let comp;
  try { setStatus('Compiling…', 'run'); comp = await pickCompiler(l); }
  catch (e) { write(networkHelp(e), 'stderr'); return false; }
  const body = JSON.stringify({ code, stdin, compiler: comp.name, save: false });
  const ctrl = new AbortController(); const t = setTimeout(() => ctrl.abort(), 30000);
  let res;
  try {
    const r = await fetch(`${WANDBOX}/compile.json`, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body, signal: ctrl.signal });
    if (!r.ok) throw new Error('Compiler service returned ' + r.status);
    res = await r.json();
  } catch (e) {
    write(e.name === 'AbortError' ? '⏱ Compiler service timed out. Try again.\n' : networkHelp(e), 'stderr'); return false;
  } finally { clearTimeout(t); }
  if (res.compiler_error) write(res.compiler_error.replace(/prog\.\w+/g, l.file), 'compile');
  if (res.program_output) write(res.program_output, 'stdout');
  if (res.program_error) write(res.program_error, 'stderr');
  if (res.signal) write(`\nProcess killed by signal: ${res.signal}\n`, 'stderr');
  const ok = String(res.status) === '0';
  if (!ok && res.status != null) write(`\nExited with code ${res.status}\n`, 'meta');
  return ok;
}
function networkHelp(e) {
  return `Couldn't reach the compiler service (${e.message}). Check your connection and try again.\n`;
}

async function run() {
  if (running) return;
  running = true; $('run').disabled = true;
  const l = LANGS[currentLang], code = editor.get(), stdin = $('stdin').value;
  store.set('code:' + currentLang, code);
  clearOutput(); setStatus('Running…', 'run');
  const t0 = performance.now();
  let ok = false;
  try {
    ok = l.runner === 'js' ? await runJS(code, stdin)
       : l.runner === 'py' ? await runPython(code, stdin)
       : await runWandbox(l, code, stdin);
  } catch (e) { write(String(e) + '\n', 'stderr'); }
  const secs = ((performance.now() - t0) / 1000).toFixed(2);
  if (!out.textContent.trim()) write('(no output)\n', 'meta');
  setStatus(ok ? `Done · ${secs}s` : 'Error', ok ? 'ok' : 'err');
  updateLangUI();
  running = false; $('run').disabled = false;
}

/* ===================== Boot ===================== */
updateLangUI();
loadMonaco();
</script>
